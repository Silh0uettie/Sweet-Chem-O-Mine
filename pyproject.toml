[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweet-chem-o-mine"
version = "0.1.3"
description = "Desktop chemical UMAP explorer for structure-activity datasets."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cheminformatics", "umap", "rdkit", "chemical-space", "screening"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "PySide6>=6.8,<6.9",
    "rdkit>=2024.3",
    "umap-learn>=0.5.6",
    "xlrd>=2.0.1",
]

[project.scripts]
sweet-chem-o-mine = "sweet_chem_o_mine.app:main"
scom = "sweet_chem_o_mine.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sweet_chem_o_mine = ["assets/*.png"]
